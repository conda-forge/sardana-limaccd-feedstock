schema_version: 1

context:
  name: sardana-limaccd
  version: "1.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: a5b4dd685fa4ea3147a1d8b6fe07c07debc6e1c16d424249bf416acdd4b9a4d3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sardana

tests:
  - python:
      imports:
        - sardana_limaccd
      python_version: ["${{ python_min }}.*", "3.*"]
      pip_check: true

about:
  summary: LimaCCDs Tango plugins for Sardana
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://gitlab.com/sardana-org/sardana-limaccd

extra:
  recipe-maintainers:
    - rhomspuron
    - ovallcorba
